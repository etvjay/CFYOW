name: EXP-003 Studionet Evidence

on:
  workflow_dispatch:
    inputs:
      require_appeal:
        description: "Fail rather than skip if appeal cannot execute"
        required: false
        default: "1"
      appeal_value:
        description: "Optional positive appeal bond override; blank uses network minimum"
        required: false
        default: ""
  push:
    branches: ["research/experiment-ledger-v1"]
    paths:
      - "contracts/consequence_*.py"
      - "tests/integration/test_exp003_*.py"
      - "experiment_ledger/adapters/genlayer_*.py"
      - "experiment_ledger/adapters/exp003_*.py"
      - "gltest.config.yaml"
      - ".github/workflows/exp003-network.yml"

permissions:
  contents: read
  issues: write

jobs:
  appeal-reexecution:
    name: Appeal re-execution capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXP003_REQUIRE_APPEAL: ${{ github.event_name == 'workflow_dispatch' && inputs.require_appeal || '0' }}
      EXP003_APPEAL_VALUE: ${{ github.event_name == 'workflow_dispatch' && inputs.appeal_value || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Capture appeal-induced duplicate behavior
        run: >-
          gltest tests/integration/test_exp003_appeal_reexecution.py
          -v -s --network studionet
          --default-wait-retries 60
      - name: Capture semantic-overturn behavior
        run: >-
          gltest tests/integration/test_exp003_semantic_overturn.py
          -v -s --network studionet
          --default-wait-retries 60
      - name: Restore mutable evidence fixture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, requests
          body = '''CFYOW controlled external-evidence fixture.

          EVIDENCE_STATUS: SATISFIED

          The deployed service returns HTTP 200 and JSON `{ "status": "ok" }` at `/health`.

          This issue is mutated by the EXP-003 semantic-overturn workflow between initial ACCEPTED state and appeal re-execution. It is an experimental fixture, not a product issue.
          '''
          response = requests.patch(
              "https://api.github.com/repos/etvjay/CFYOW/issues/3",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "CFYOW-EXP003-cleanup",
              },
              json={"body": body},
              timeout=20,
          )
          response.raise_for_status()
          PY
      - name: Upload EXP-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp003-studionet-evidence-${{ github.run_id }}
          path: artifacts/EXP-003/
          if-no-files-found: warn
          retention-days: 30
